# ═══════════════════════════════════════════════════════════════
# UNDR — SVEGLIA IL CLOUD
#
# Supabase mette in pausa i progetti gratuiti quando restano senza traffico,
# e dopo un lungo periodo di pausa li ELIMINA. Il 13/08/2026 è successo:
# entrambi i progetti si erano addormentati e UNDR FM era giù.
#
# Questo lavoro tocca i due progetti ogni 3 giorni, così contano come attivi.
# Gira sui server di GitHub: funziona anche a computer spento.
#
# Gli indirizzi e le chiavi stanno nei "secrets" del repo (Settings → Secrets):
#   SB_URL / SB_KEY  → cloud delle playlist crew
#   FM_URL / FM_KEY  → cloud del catalogo UNDR FM
# Se un giorno ricrei i progetti, aggiorna i secrets e qui non tocchi niente.
# ═══════════════════════════════════════════════════════════════

name: Sveglia il cloud

on:
  schedule:
    # ogni 3 giorni alle 04:17 UTC — orario spostato apposta, i minuti tondi
    # sono affollati e GitHub ritarda o salta le esecuzioni
    - cron: '17 4 */3 * *'
  workflow_dispatch:        # permette di lanciarlo a mano dalla scheda Actions

jobs:
  sveglia:
    runs-on: ubuntu-latest
    steps:
      - name: Tocca i due progetti Supabase
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}
          FM_URL: ${{ secrets.FM_URL }}
          FM_KEY: ${{ secrets.FM_KEY }}
        run: |
          set -u
          esito=0

          # ── cloud delle crew: una lettura tramite la funzione controllata ──
          # (la tabella non è leggibile direttamente: è la blindatura di luglio)
          codice=$(curl -s -o /tmp/crew.txt -w '%{http_code}' --max-time 45 \
            -X POST "$SB_URL/rest/v1/rpc/undr_get_crew" \
            -H 'Content-Type: application/json' \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
            -d '{"p_code":"__sveglia__"}' || echo 000)
          if [ "$codice" = "200" ]; then
            echo "CREW  ... sveglio (HTTP 200)"
          else
            echo "CREW  ... NON RISPONDE (HTTP $codice)"
            esito=1
          fi

          # ── cloud della radio: conta i generi ──
          intervallo=$(curl -s -I --max-time 45 \
            "$FM_URL/genres?select=id" \
            -H "apikey: $FM_KEY" -H "Authorization: Bearer $FM_KEY" \
            -H 'Prefer: count=exact' -H 'Range: 0-0' \
            | tr -d '\r' | grep -i '^content-range' || true)
          if [ -n "$intervallo" ]; then
            echo "FM    ... sveglio ($intervallo)"
          else
            echo "FM    ... NON RISPONDE"
            esito=1
          fi

          if [ "$esito" -ne 0 ]; then
            echo ""
            echo "Almeno un progetto non risponde: entra su supabase.com/dashboard"
            echo "e controlla se è in pausa. La procedura completa è in UNDR CREW 2.0."
          fi
          exit $esito

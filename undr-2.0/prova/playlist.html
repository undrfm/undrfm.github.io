<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNDR — cosa fa sfarfallare la playlist</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#07060a;color:#efeaf7;font-family:ui-monospace,'Courier New',monospace;overflow:hidden}

  .aurora{position:fixed;inset:-45%;z-index:0;opacity:.15;
    background:conic-gradient(from 0deg,#c8f53a,#7b3af5,#3af5d0,#f53ab4,#f5a83a,#c8f53a);
    filter:blur(110px);animation:giro 9s linear infinite}
  .blob{position:fixed;border-radius:50%;filter:blur(85px);opacity:.45;z-index:0}
  .blob.l{width:380px;height:380px;background:#c8f53a;top:-110px;right:-80px;animation:der 10s infinite alternate ease-in-out}
  .blob.v{width:440px;height:440px;background:#7b3af5;bottom:-80px;left:-150px;animation:der 13s infinite alternate-reverse ease-in-out}
  .blob.t{width:320px;height:320px;background:#3af5d0;top:38%;left:52%;opacity:.16;animation:der 16s infinite alternate ease-in-out}
  @keyframes giro{to{transform:rotate(360deg)}}
  @keyframes der{from{transform:translate(0,0) scale(1)}to{transform:translate(34px,44px) scale(1.22)}}
  @keyframes disco{to{transform:rotate(360deg)}}

  header{position:fixed;top:0;left:0;right:0;z-index:6;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;
    background:rgba(10,9,16,.72);border-bottom:1px solid rgba(255,255,255,.18);
    display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  button{font:inherit;font-size:11px;letter-spacing:.06em;padding:8px 10px;border-radius:16px;cursor:pointer;
    background:rgba(255,255,255,.06);color:#efeaf7;border:1px solid rgba(255,255,255,.32)}
  button.on{background:#c8f53a;color:#07060a;border-color:#c8f53a;font-weight:700}

  .lista{position:relative;z-index:2;padding:104px 14px 40px;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .riga{display:flex;align-items:center;gap:12px;margin-bottom:9px;padding:10px 12px;border-radius:16px;
    background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.18)}
  .cop{width:52px;height:52px;border-radius:50%;flex:none;object-fit:cover;
       background:linear-gradient(135deg,#c8f53a,#7b3af5)}
  /* la copertina in riproduzione: gira e ha l'alone, come nell'app */
  body.gira .riga.ora .cop{animation:disco 5s linear infinite;
       border:2px solid #c8f53a;box-shadow:0 0 20px rgba(200,245,58,.55)}
  .tit{font-family:system-ui,sans-serif;font-size:15px;font-weight:600}
  .sot{font-size:11px;color:#9a92b0;letter-spacing:.06em}

  /* il video sta dietro, come quando torni alla playlist e la musica continua */
  #tv{position:fixed;left:0;top:0;width:220px;height:124px;z-index:1;opacity:.001;pointer-events:none}
  body.tvvisibile #tv{opacity:1;z-index:3;top:104px;left:14px;width:60%;height:120px}
  .fps{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:0;right:0;z-index:6;
    text-align:center;font-size:12px;color:#c8f53a;text-shadow:0 0 8px #000}
</style>

<div class="aurora"></div><div class="blob l"></div><div class="blob v"></div><div class="blob t"></div>

<header>
  <button id="b1" class="on" onclick="tog('video')">1 · VIDEO acceso</button>
  <button id="b2" class="on" onclick="tog('gira')">2 · copertina che GIRA</button>
  <button id="b3" class="on" onclick="tog('foto')">3 · copertine da INTERNET</button>
</header>

<div class="lista" id="lista"></div>
<iframe id="tv" allow="autoplay; fullscreen" allowfullscreen src="about:blank"></iframe>
<div class="fps" id="fps">…</div>

<script>
var VIDEI = ['xkEju-deJsE','W3q8Od5qJio','9bZkp7q19f0','kJQP7kiw5Fk','RgKAFK5djSk',
             'JGwWNGJdvx8','OPf0YbXqDm0','CevxZvSJLk8','fRh_vgS2dFE','09R8_2nJtjg'];
var stato = { video: true, gira: true, foto: true };

function disegna() {
  var h = '';
  for (var i = 0; i < 25; i++) {
    var v = VIDEI[i % VIDEI.length];
    var cop = stato.foto
      ? '<img class="cop" src="https://i.ytimg.com/vi/' + v + '/mqdefault.jpg?r=' + i + '" alt="">'
      : '<div class="cop"></div>';
    h += '<div class="riga' + (i === 2 ? ' ora' : '') + '">' + cop +
         '<div><div class="tit">traccia ' + (i + 1) + '</div>' +
         '<div class="sot">band ' + (i + 1) + '</div></div></div>';
  }
  document.getElementById('lista').innerHTML = h;
}

function video(acceso) {
  var f = document.getElementById('tv');
  if (acceso) {
    var p = ['autoplay=1','playsinline=1','controls=1','rel=0','modestbranding=1','enablejsapi=1',
             'origin=' + encodeURIComponent(location.origin)].join('&');
    f.src = 'https://www.youtube-nocookie.com/embed/xkEju-deJsE?' + p;
  } else {
    f.src = 'about:blank';
  }
}

function tog(q) {
  stato[q] = !stato[q];
  document.getElementById(q === 'video' ? 'b1' : q === 'gira' ? 'b2' : 'b3')
    .classList.toggle('on', stato[q]);
  document.getElementById(q === 'video' ? 'b1' : q === 'gira' ? 'b2' : 'b3')
    .textContent = (q === 'video' ? '1 · VIDEO ' : q === 'gira' ? '2 · copertina che GIRA ' : '3 · copertine da INTERNET ')
    + (stato[q] ? (q === 'video' ? 'acceso' : '') : 'SPENTO');
  document.body.classList.toggle('gira', stato.gira);
  if (q === 'video') video(stato.video);
  if (q === 'foto') disegna();
  azzera();
}

document.body.classList.add('gira');
disegna();
video(true);

var frame = 0, inizio = performance.now(), peggiore = 0, ultimo = inizio;
function azzera(){ frame = 0; inizio = performance.now(); peggiore = 0; ultimo = inizio; }
(function giro(){
  var o = performance.now(), salto = o - ultimo;
  if (frame > 5 && salto > peggiore) peggiore = salto;
  ultimo = o; frame++;
  var sec = (o - inizio) / 1000;
  if (sec > 0.8) document.getElementById('fps').textContent =
    (frame / sec).toFixed(0) + ' al secondo · scatto peggiore ' + peggiore.toFixed(0) + ' ms';
  requestAnimationFrame(giro);
})();
</script>
